name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install
      - run: bun run verify

  docker-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker compose config --quiet
        env:
          PLATFORM_API_KEY: ci-only-placeholder
      - run: docker build --file docker/app.Dockerfile --tag platform:ci .
      - run: docker build --file docker/app-musl.Dockerfile --tag platform:musl-ci .
