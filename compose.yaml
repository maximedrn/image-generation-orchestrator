name: stable-diffusion-platform

x-engine-common: &engine-common
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 2048
  environment:
    SDCPP_VAE_TILING: ${SDCPP_VAE_TILING:-true}
    SDCPP_BACKEND_PLACEMENT: ${SDCPP_BACKEND_PLACEMENT:-}
    SDCPP_PARAMS_BACKEND: ${SDCPP_PARAMS_BACKEND:-}
  tmpfs:
    - /tmp:size=256m,mode=1777
  healthcheck:
    test: ["CMD", "/usr/local/bin/engine-healthcheck"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 30s
  volumes:
    - ${MODEL_DIRECTORY:-./models}:/models:ro
  networks:
    inference:
      aliases:
        - engine
  command:
    - -m
    - ${MODEL_FILE:-/models/model.gguf}
    - --listen-ip
    - 0.0.0.0
    - --listen-port
    - "8080"

services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PLATFORM_API_KEY: ${PLATFORM_API_KEY:?set PLATFORM_API_KEY}
      PLATFORM_CONFIG: /config/platform.${ENGINE_BACKEND:-cpu}.yaml
    ports:
      - ${PLATFORM_PORT:-3000}:3000
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:3000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    extra_hosts:
      - host.docker.internal:host-gateway
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./config:/config:ro
      - platform-data:/var/lib/stable-diffusion-platform
    networks:
      - inference
      - egress

  engine-cpu:
    <<: *engine-common
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: docker/engine-cpu.Dockerfile

  engine-cuda:
    <<: *engine-common
    profiles: ["cuda"]
    build:
      context: .
      dockerfile: docker/engine-cuda.Dockerfile
    gpus: all

  engine-rocm:
    <<: *engine-common
    profiles: ["rocm"]
    build:
      context: .
      dockerfile: docker/engine-rocm.Dockerfile
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - ${VIDEO_GID:-44}
      - ${RENDER_GID:-109}

  engine-vulkan:
    <<: *engine-common
    profiles: ["vulkan"]
    build:
      context: .
      dockerfile: docker/engine-vulkan.Dockerfile
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${VIDEO_GID:-44}
      - ${RENDER_GID:-109}

networks:
  inference:
    internal: true
  egress:
    internal: false

volumes:
  platform-data:
