server:
  host: "0.0.0.0"
  port: 3000
  bodyLimitBytes: 1048576
security:
  auth: "bearer"
  apiKeyEnv: "PLATFORM_API_KEY"
queue:
  leaseSeconds: 120
  maxAttempts: 3
  maxQueuedJobs: 1000
  maxRunningJobs: 1
  pollIntervalMs: 250
  recoveryIntervalSeconds: 10
limits:
  maxBatch: 4
  maxHeight: 2048
  maxInputBytes: 65536
  maxJobCost: 134217728
  maxPixels: 4194304
  maxSteps: 80
  maxWidth: 2048
models:
  default:
    maxHeight: 2048
    maxWidth: 2048
rateLimit:
  maxRequests: 120
  maxTrackedClients: 10000
  windowSeconds: 60
storage:
  root: "/var/lib/stable-diffusion-platform"
engines:
  - id: "primary"
    provider: "stable-diffusion-cpp"
    backend: "vulkan"
    url: "http://engine:8080"
    models: ["default"]
    maxConcurrent: 1
    requestTimeoutSeconds: 30
    circuitBreaker:
      failureThreshold: 3
      cooldownSeconds: 30
