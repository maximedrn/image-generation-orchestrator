name: stable-diffusion-platform

x-engine-common: &engine-common
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 2048
  tmpfs:
    - /tmp:size=256m,mode=1777
  healthcheck:
    test:
      - CMD
      - curl
      - --fail
      - --silent
      - --show-error
      - http://127.0.0.1:8080/sdcpp/v1/capabilities
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 30s
  volumes:
    - ${MODEL_DIRECTORY:-./models}:/models:ro
  networks:
    inference:
      aliases:
        - engine
  # Every sd-server flag lives in one variable, so tuning never rebuilds an image.
  command: ${ENGINE_ARGS:--m /models/model.gguf --listen-ip 0.0.0.0 --listen-port 8080 --vae-tiling}

services:
  app:
    build:
      context: .
      dockerfile: config/docker/app.Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PLATFORM_API_KEY: ${PLATFORM_API_KEY:?set PLATFORM_API_KEY}
      PLATFORM_CONFIG: /config/platform.yaml
      ENGINE_BACKEND: ${ENGINE_BACKEND:-cpu}
      ENGINE_URL: ${ENGINE_URL:-http://engine:8080}
      MODEL_DIRECTORY: /models
    env_file:
      - path: .env
        required: false
    ports:
      - ${PLATFORM_PORT:-3000}:3000
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1:3000/health/live
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    extra_hosts:
      - host.docker.internal:host-gateway
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./config:/config:ro
      - ${MODEL_DIRECTORY:-./models}:/models
      - platform-data:/var/lib/stable-diffusion-platform
    networks:
      - inference
      - egress

  engine-cpu:
    <<: *engine-common
    profiles: ["cpu"]
    build: &engine-build
      context: .
      dockerfile: config/docker/engine.Dockerfile

  engine-cuda:
    <<: *engine-common
    profiles: ["cuda"]
    build:
      <<: *engine-build
      args:
        BUILD_IMAGE: nvidia/cuda:13.3.1-devel-ubuntu26.04
        RUNTIME_IMAGE: nvidia/cuda:13.3.1-runtime-ubuntu26.04
        SD_CMAKE_FLAGS: -DSD_CUDA=ON
    gpus: all

  engine-rocm:
    <<: *engine-common
    profiles: ["rocm"]
    build:
      <<: *engine-build
      args:
        BUILD_IMAGE: rocm/dev-ubuntu-26.04:7.14.0-full
        RUNTIME_IMAGE: rocm/dev-ubuntu-26.04:7.14.0-full
        RUNTIME_PACKAGES: ""
        SD_CMAKE_FLAGS: -DSD_HIPBLAS=ON
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - ${VIDEO_GID:-44}
      - ${RENDER_GID:-109}

  engine-vulkan:
    <<: *engine-common
    profiles: ["vulkan"]
    build:
      <<: *engine-build
      args:
        BUILD_PACKAGES: glslc libvulkan-dev
        RUNTIME_PACKAGES: libgomp1 libvulkan1 mesa-vulkan-drivers
        SD_CMAKE_FLAGS: -DSD_VULKAN=ON
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${VIDEO_GID:-44}
      - ${RENDER_GID:-109}

networks:
  inference:
    internal: true
  egress:
    internal: false

volumes:
  platform-data:
